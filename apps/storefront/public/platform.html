<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Mercadia · Panel maestro</title><link rel="stylesheet" href="/css/platform.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/"><img src="/icons/mercadia-app.png" alt=""><span>Mercadia Maestro</span></a><button class="secondary hidden" id="platform-logout">Cerrar sesión</button></header>
  <main>
    <section class="platform-login account-shell" id="platform-login-view">
      <span class="eyebrow">ACCESO PRIVADO</span><h1>Panel maestro</h1>
      <form id="platform-login-form" class="form-stack">
        <label>Correo<input name="email" type="email" required></label>
        <label>Contraseña<input name="password" type="password" required></label>
        <button class="primary">Entrar</button><p class="form-message" id="platform-message"></p>
      </form>
    </section>
    <section class="account-shell hidden" id="platform-dashboard">
      <div class="account-head"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Usuarios y pagos</h1></div><button class="secondary" id="refresh-accounts">Actualizar</button></div>
      <div class="admin-list" id="merchant-list"></div>
    </section>
  </main>
  <script src="/config.js"></script><script type="module" src="/js/platform-admin.js"></script>
</body>
</html>
