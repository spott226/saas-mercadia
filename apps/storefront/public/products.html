<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/mercadia-app.png">

<title>Productos</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="/css/styles.css">

</head>

<body>


<!-- =========================
NAVBAR
========================= -->

<header class="shadow sticky top-0 z-50">

<div class="max-w-7xl mx-auto flex justify-between items-center p-4">

<a href="/index.html" class="brand-link flex items-center gap-3">

<img
id="store-logo"
src="/icons/mercadia-app.png"
class="h-10 w-auto"
>

<h1 id="store-name" class="text-lg font-bold">
Tienda
</h1>

</a>


<nav class="hidden md:flex gap-8 text-sm font-medium">

<a href="/index.html" class="hover:opacity-70">Inicio</a>

<a href="/products.html" class="hover:opacity-70">Productos</a>

<a href="/categorias.html" class="hover:opacity-70">Categorías</a>

<a href="/mi-cuenta.html" class="hover:opacity-70">Mi cuenta</a>

</nav>


<div class="flex items-center gap-4">

<button onclick="openCart()" class="relative w-12 h-12 rounded flex items-center justify-center">

<span class="text-lg">🛒</span>

<span 
id="cart-count"
class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] px-1.5 rounded-full"
>
0
</span>

</button>


<button id="menu-btn" class="md:hidden text-2xl">
☰
</button>

</div>

</div>


<div id="mobile-menu" class="hidden md:hidden border-t">

<a href="/index.html" class="block p-4 border-b">Inicio</a>

<a href="/products.html" class="block p-4 border-b">Productos</a>

<a href="/categorias.html" class="block p-4 border-b">Categorías</a>

<a href="/mi-cuenta.html" class="block p-4">Mi cuenta</a>

</div>

</header>



<!-- =========================
TITLE
========================= -->

<section class="max-w-7xl mx-auto p-6 md:p-10">

<h2 class="text-2xl md:text-3xl font-bold mb-8 text-center">
Todos los productos
</h2>


<div
id="products-list"
class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8"
>

</div>

</section>



<!-- =========================
FOOTER
========================= -->

<footer class="mt-20">

<div class="max-w-7xl mx-auto p-8 text-center opacity-80">

<p id="store-footer">
Powered by Mercadia
</p>

</div>

</footer>



<!-- =========================
CARRITO
========================= -->

<div id="cart-modal" class="hidden modal-backdrop">

  <div class="modal-panel cart-panel">

    <div class="modal-header">
      <div>
        <h2>Tu carrito</h2>
        <p>Revisa tu pedido antes de enviarlo</p>
      </div>
      <button onclick="closeCart()" class="modal-icon-btn" aria-label="Cerrar carrito">x</button>
    </div>

    <div id="cart-items" class="modal-body"></div>

    <div class="modal-footer">

      <div class="modal-total">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>

      <div class="modal-actions">
        <button onclick="closeCart()" class="btn-secondary">
          Cerrar
        </button>

        <button onclick="checkout()" class="btn-primary">
          Enviar pedido
        </button>
      </div>

    </div>

  </div>

</div>


<!-- =========================
FORMULARIO CHECKOUT
========================= -->

<div id="checkout-modal" class="hidden modal-backdrop modal-backdrop-strong">

  <div class="modal-panel checkout-panel">

    <div class="modal-header">
      <div>
        <h2>Datos de envio</h2>
        <p>Completa la informacion para coordinar tu pedido</p>
      </div>
      <button onclick="closeCheckout()" class="modal-icon-btn" aria-label="Cerrar checkout">x</button>
    </div>

    <div class="checkout-grid">
      <input id="c-name" placeholder="Nombre completo" class="checkout-input">
      <input id="c-phone" placeholder="Telefono" class="checkout-input">
      <input id="c-address" placeholder="Calle y numero" class="checkout-input checkout-wide">
      <input id="c-colony" placeholder="Colonia" class="checkout-input">
      <input id="c-city" placeholder="Ciudad" class="checkout-input">
      <input id="c-state" placeholder="Estado" class="checkout-input">
      <input id="c-postal" placeholder="Codigo postal" class="checkout-input">
      <input id="c-ref" placeholder="Referencia (opcional)" class="checkout-input checkout-wide">
    </div>

    <div class="modal-actions modal-actions-stacked">
      <button onclick="sendCheckout()" class="btn-primary" data-checkout-submit>
        Enviar pedido
      </button>

      <button onclick="closeCheckout()" class="btn-secondary">
        Cancelar
      </button>
    </div>

  </div>

</div>


<!-- =========================
SCRIPTS
========================= -->

<script src="/config.js"></script>
<script type="module" src="/js/pwa.js"></script>
<script type="module" src="/js/store.js"></script>
<script type="module" src="/js/products.js"></script>
<script type="module" src="/js/cart.js"></script>


<script>

const btn = document.getElementById("menu-btn")
const menu = document.getElementById("mobile-menu")

btn.addEventListener("click", () => {
  menu.classList.toggle("hidden")
})

</script>

</body>
</html>
